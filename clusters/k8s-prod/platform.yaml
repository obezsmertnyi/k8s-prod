# The platform itself: the HelmReleases of the two local charts. Starts after Kyverno and its CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./releases
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
