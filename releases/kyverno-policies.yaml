# The Kyverno policies, from charts/kyverno-policies. They need the Kyverno CRDs, so they wait for the kyverno release;
# istio-sidecar-for-students makes pods use the Istio injector, so it also waits for istiod.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: kyverno
    - name: istiod
  interval: 10m
  releaseName: kyverno-policies
  chart:
    spec:
      chart: ./charts/kyverno-policies
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
