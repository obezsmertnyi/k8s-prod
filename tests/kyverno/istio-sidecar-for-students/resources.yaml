apiVersion: v1
kind: Pod
metadata:
  name: student-nolabels
  namespace: student01
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: student-labels
  namespace: student01
  labels:
    app: demo
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: student-optout
  namespace: student02
  labels:
    app: demo
    sidecar.istio.io/inject: 'false'
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: student-already
  namespace: student01
  labels:
    app: demo
    sidecar.istio.io/inject: 'true'
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: student-wrong-person
  namespace: student02
  labels:
    app: demo
    person: mentor
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: person-in-default
  namespace: default
  labels:
    app: demo
    person: student
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: mentor-pod
  namespace: mentor
  labels:
    app: demo
    person: mentor
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: mentor-optout
  namespace: mentor
  labels:
    app: demo
    sidecar.istio.io/inject: 'false'
spec:
  containers:
    - name: app
      image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: default-pod
  namespace: default
  labels:
    app: demo
spec:
  containers:
    - name: app
      image: busybox:1.37
