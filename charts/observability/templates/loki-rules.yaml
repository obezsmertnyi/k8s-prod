{{- /*
The Loki ruler reads its rules from files; the rules sidecar of the Loki release writes every ConfigMap with the label
loki_rule: "1" of the monitoring namespace (the only one it reads) into the ruler's directory. The file is read with
.Files, so the {{ $labels }} of the alert annotations are not rendered by Helm.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules-readonly-rootfs
  namespace: {{ .Release.Namespace }}
  labels:
    loki_rule: "1"
data:
  readonly-rootfs.yaml: |-
    {{- .Files.Get "files/loki-rules.yaml" | nindent 4 }}
