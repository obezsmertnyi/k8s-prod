# Access is granted only through RoleBindings to the built-in edit (read-write) and view (read-only) ClusterRoles.
# No ClusterRoleBinding names a person, and edit cannot change RBAC, so nobody here can reach cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mentor-edit
  namespace: mentor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: mentor
---
