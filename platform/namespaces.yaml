# The role label is what the policies select on. Namespaces are cluster-scoped, so only the cluster admin can set it.
# Pod Security baseline is enforced so that `edit` cannot be turned into cluster-admin with a privileged or hostPath pod.
apiVersion: v1
kind: Namespace
metadata:
  name: mentor
  labels:
    k8s-prod.io/role: mentor
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
---
