version: 2
updates:
  # Action pins are full commit SHAs with the version in a comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The rev of every hook in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns: ["*"]
